<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SATUNOTA — Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FFFFFF;
      color: #37352F;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
    }
    .card {
      max-width: 400px;
      padding: 32px 24px;
      border: 1px solid #E9E9E8;
      border-radius: 8px;
      background-color: #F7F7F5;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #787774;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      padding: 10px 20px;
      background-color: #2383E2;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
    }
    a:hover {
      background-color: #1D72C8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Anda Sedang Offline</h1>
    <p>Halaman ini belum pernah dimuat sebelumnya dan Anda sedang tidak terhubung ke internet. Buka halaman utama atau riwayat yang sudah tersimpan di memori lokal.</p>
    <a href="/">Kembali ke SATUNOTA</a>
  </div>
</body>
</html>
